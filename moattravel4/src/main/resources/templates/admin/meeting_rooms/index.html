<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Bootstrap -->

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

	<!-- Google Fonts -->

	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

	<link th:href="@{/css/style.css}" rel="stylesheet">

	<title>会議室一覧</title>

</head>

<body>

	<div class="moattravel-wrapper">

		<!-- ヘッダー -->

		<nav class="navbar navbar-expand-md navbar-light bg-white shadow-sm moattravel-navbar">

			<div class="container moattravel-container">

				<a class="navbar-brand" th:href="@{/}">

					会議予約システムの画像、もしくは文字のみ

					<img class="moattravel-logo me-1" th:src="@{/images/logo.png}" alt="moat Travel">

				</a>

			</div>

		</nav>

		<main>

			<div class="container pt-4 pb-5 moattravel-container">

				<div class="row justify-content-center">

					<div class="col-xxl-9 col-xl-10 col-lg-11">

						<h1 class="mb-4 text-center">会議室一覧</h1>

						<div class="d-flex justify-content-end">

							<a href="#" class="btn text-white shadow-sm mb-3 moattravel-btn">登録</a>

						</div>

						<table class="table">

							<thead>

								<tr>

									<th scope="col">ID</th>

									<th scope="col">会議室名</th>

									<th scope="col">料金</th>

									<th scope="col">郵便番号</th>

									<th scope="col">住所</th>

									<th scope="col">電話番号</th>

									<th scope="col"></th>

								</tr>

							</thead>

							<tbody>

								<tr th:each="meetingRoom : ${meetingRooms}">

									<td th:text="${meetingRoom.getId()}"></td>

									<td th:text="${meetingRoom.getName()}"></td>

									<td th:text="${meetingRoom.getPrice() + '円'}"></td>

									<td th:text="${meetingRoom.getPostalCode()}"></td>

									<td th:text="${meetingRoom.getAddress()}"></td>

									<td th:text="${meetingRoom.getPhoneNumber()}"></td>

									<td><a href="#">詳細</a></td>

								</tr>

							</tbody>

						</table>

						<!-- ページネーション -->

						<div th:if="${meetingRoomsPage.getTotalPages() > 1}" class="d-flex justify-content-center">

							<nav aria-label="民宿一覧ページ">

								<ul class="pagination">

									<li class="page-item">

										<a th:unless="${meetingRoomsPage.isFirst()}"
											th:href="@{/admin/meeting_rooms(page = ${meetingRoomsPage.getNumber() - 1})}"
											class="page-link moattravel-page-link">前</a>

									</li>

									<li th:each="i : ${#numbers.sequence(0, meetingRoomsPage.getTotalPages() - 1)}"
										class="page-item">

										<span th:if="${i == meetingRoomsPage.getNumber()}"
											class="page-link active moattravel-active" th:text="${i + 1}"></span>

										<a th:unless="${i == meetingRoomsPage.getNumber()}"
											th:href="@{/admin/meeting_rooms(page = ${i})}"
											class="page-link moattravel-page-link" th:text="${i + 1}"></a>

									</li>

									<li class="page-item">

										<a th:unless="${meetingRoomsPage.isLast()}"
											th:href="@{/admin/meeting_rooms(page = ${meetingRoomsPage.getNumber() + 1})}"
											class="page-link moattravel-page-link">次</a>

									</li>

								</ul>

							</nav>

						</div>

					</div>

				</div>

			</div>

		</main>

		<!-- フッター -->

		<footer>

			<div class="d-flex justify-content-center align-items-center h-100">

				<p class="text-center text-muted small mb-0">&copy; Meeting Room App All rights reserved.</p>

			</div>

		</footer>

	</div>

	<!-- Bootstrap -->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
		crossorigin="anonymous"></script>

</body>

</html>
