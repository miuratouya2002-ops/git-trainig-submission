<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<div th:replace="~{fragment :: meta}"></div>
	<div th:replace="~{fragment :: styles}"></div>
	<title>会議室予約システム</title>
</head>

<body>
	<div class="moattravel-wrapper">
		<!-- ヘッダー -->
		<div th:replace="~{fragment :: header}"></div>

		<main>
			<div class="container pt-4 pb-5 moattravel-container">
				<!-- ログイン成功メッセージ -->
				<div th:if="${param.loggedIn}" class="alert alert-info">
					ログインしました。
				</div>
				<!-- ログアウト完了メッセージ -->
				<div th:if="${param.loggedOut}" class="alert alert-info">
					ログアウトしました。
				</div>

				<div class="text-center">
					<h1 class="mb-4">ようこそ！会議室予約システムへ</h1>
					<p>ここはトップページです。</p>

					<!-- 管理者であれば管理画面へのリンクを表示 -->
					<div sec:authorize="hasRole('ROLE_ADMIN')">
						<a th:href="@{/admin/meeting_rooms}" class="btn moattravel-btn text-white">管理者用：会議室管理へ</a>
					</div>
				</div>
			</div>
		</main>

		<!-- フッター -->
		<div th:replace="~{fragment :: footer}"></div>
	</div>
	<div th:replace="~{fragment :: scripts}"></div>
</body>

</html>
